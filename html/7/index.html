<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7 | Video Invite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #eaffea;
      background: #040704;
      padding: 24px;
    }
    main {
      width: min(860px, 100%);
      margin: 0 auto;
      background: #081108;
      border: 1px solid #39ff14;
      padding: 24px;
    }
    h1 { color: #39ff14; margin-top: 0; }
    video {
      width: 100%;
      border: 4px solid #39ff14;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      margin-top: 18px;
      padding: 12px;
      color: #eaffea;
      background: #020402;
      border: 1px solid #1fbf10;
      font: inherit;
    }
    .status { color: #39ff14; font-weight: 700; min-height: 24px; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav style="width:min(860px,100%);margin:0 auto 18px;">
    <a href="#invite" style="color:#39ff14;">Video Invite</a>
  </nav>

  <!-- Main -->
  <main id="invite">
    <h1>Community Event Video Invite</h1>
    <video controls oncanplay="videoReady()" poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%23030603'/%3E%3Ccircle cx='640' cy='360' r='130' fill='%2339ff14'/%3E%3Cpath d='M610 285 L610 435 L735 360 Z' fill='%23030603'/%3E%3Ctext x='320' y='620' fill='%23eaffea' font-family='Arial' font-size='56'%3ENeon City Event Invite%3C/text%3E%3C/svg%3E">
      <source src="event-invite.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <p id="videoStatus" class="status">Add an event-invite.mp4 file in this folder to play the promo video.</p>

    <label for="draft">Registration Notes</label>
    <textarea id="draft" placeholder="Type unfinished form notes here" oninput="markDirty()"></textarea>
    <p class="status">The page warns before leaving after you type notes.</p>
  </main>

  <!-- Footer -->
  <footer style="width:min(860px,100%);margin:24px auto;color:#baffba;">
    <p>Exercise 7: video controls, source, oncanplay, and beforeunload warning.</p>
  </footer>

  <script>
    let formUnfinished = false;

    function videoReady() {
      document.getElementById('videoStatus').textContent = 'Video ready to play';
    }

    function markDirty() {
      formUnfinished = true;
    }

    window.onbeforeunload = function () {
      if (formUnfinished) {
        return 'You have unfinished form notes. Are you sure you want to leave?';
      }
    };
  </script>
</body>
</html>
