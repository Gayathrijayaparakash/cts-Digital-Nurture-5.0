<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6 | Event Feedback Handling</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #eaffea;
      background: #030603;
      padding: 24px;
    }
    main {
      width: min(900px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr;
    }
    section {
      background: #081108;
      border: 1px solid #39ff14;
      padding: 22px;
    }
    h1, h2 { color: #39ff14; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; }
    input, select, textarea {
      width: 100%;
      padding: 11px;
      color: #eaffea;
      background: #020402;
      border: 1px solid #1fbf10;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 16px;
      padding: 12px 16px;
      color: #020402;
      background: #39ff14;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }
    img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 4px solid #39ff14;
      transition: transform 0.2s ease;
      background: #0b120b;
    }
    img.enlarged { transform: scale(1.08); }
    .status { color: #39ff14; min-height: 24px; font-weight: 700; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav style="width:min(900px,100%);margin:0 auto 18px;">
    <a href="#feedback" style="color:#39ff14;">Feedback</a>
  </nav>

  <!-- Main -->
  <main id="feedback">
    <section>
      <h1>Event Feedback</h1>
      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="10 digit phone number" onblur="validatePhone()">
      <p id="phoneStatus" class="status"></p>

      <label for="eventFee">Select Event</label>
      <select id="eventFee" onchange="showFee()">
        <option value="">Choose event</option>
        <option value="Free">Park Cleanup</option>
        <option value="Rs. 150">Music Night</option>
        <option value="Free">Health Camp</option>
        <option value="Rs. 50">Coding Camp</option>
      </select>
      <p id="feeStatus" class="status"></p>

      <label for="comments">Feedback</label>
      <textarea id="comments" placeholder="Share your feedback" onkeyup="countCharacters()"></textarea>
      <p class="status">Characters: <span id="charCount">0</span></p>

      <button type="button" onclick="submitFeedback()">Send Feedback</button>
      <p id="submitStatus" class="status"></p>
    </section>

    <section>
      <h2>Double-click to Enlarge</h2>
      <img id="eventImage" ondblclick="enlargeImage()" alt="Neon community event preview" title="Double-click to enlarge" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 450'%3E%3Crect width='600' height='450' fill='%23030603'/%3E%3Cpath d='M60 330 C150 170 250 390 360 180 S500 310 560 110' fill='none' stroke='%2339ff14' stroke-width='18'/%3E%3Ccircle cx='150' cy='135' r='60' fill='%2339ff14'/%3E%3Crect x='250' y='245' width='210' height='90' fill='%230f5f12' stroke='%2339ff14' stroke-width='8'/%3E%3Ctext x='72' y='405' fill='%23eaffea' font-family='Arial' font-size='42'%3ECommunity Pulse%3C/text%3E%3C/svg%3E">
    </section>
  </main>

  <!-- Footer -->
  <footer style="width:min(900px,100%);margin:24px auto;color:#baffba;">
    <p>Exercise 6: blur, change, click, double-click, and keyboard events.</p>
  </footer>

  <script>
    function validatePhone() {
      const phone = document.getElementById('phone').value.trim();
      const message = /^\d{10}$/.test(phone) ? 'Phone number looks valid.' : 'Enter exactly 10 digits.';
      document.getElementById('phoneStatus').textContent = message;
    }

    function showFee() {
      const select = document.getElementById('eventFee');
      const fee = select.value ? 'Selected event fee: ' + select.value : '';
      document.getElementById('feeStatus').textContent = fee;
    }

    function submitFeedback() {
      document.getElementById('submitStatus').textContent = 'Feedback submitted. Thank you!';
    }

    function enlargeImage() {
      document.getElementById('eventImage').classList.toggle('enlarged');
    }

    function countCharacters() {
      document.getElementById('charCount').textContent = document.getElementById('comments').value.length;
    }
  </script>
</body>
</html>
