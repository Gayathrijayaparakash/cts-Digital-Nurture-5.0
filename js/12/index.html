<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 12 | AJAX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:760px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}label{display:block;margin:14px 0 6px}input,select{width:100%;background:#020502;color:#eaffea;border:1px solid #28ff75;border-radius:6px;padding:12px}button{margin-top:18px;background:#28ff75;color:#061006;border:0;border-radius:6px;padding:12px 16px;font-weight:800}.message{margin-top:16px;color:#7cff9d}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">AJAX & Fetch API</p>
    <h1>Post Registration</h1>
    <form id="registerForm">
      <label>Name</label><input name="name" required>
      <label>Email</label><input name="email" required>
      <label>Event</label><select name="eventName"><option>Green Concert</option><option>Civic Tech Demo</option></select>
      <button id="submitBtn">Send to Mock API</button>
    </form>
    <p class="message" id="message"></p>
  </main>
</body>
</html>
