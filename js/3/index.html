<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 | Valid Events</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:980px;margin:auto}.hero{border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}.card{background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:18px}.muted{color:#9fe8ad}button{background:#28ff75;color:#061006;border:0;border-radius:6px;padding:10px 14px;font-weight:800;cursor:pointer}.status{min-height:24px;color:#7cff9d}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="tag">Conditionals, Loops, Error Handling</p>
      <h1>Upcoming Events With Seats</h1>
      <p class="status" id="status"></p>
      <div class="grid" id="eventList"></div>
    </section>
  </main>
</body>
</html>
