<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2 | Event Details</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:900px;margin:auto}.hero{border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.card{margin-top:20px;background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:22px}.seat{font-size:44px;color:#28ff75;margin:8px 0}button{background:#28ff75;color:#061006;border:0;border-radius:6px;padding:12px 16px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.12)}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="tag">Syntax, Data Types, Operators</p>
      <h1>Featured Community Event</h1>
      <div class="card">
        <h2 id="eventInfo"></h2>
        <p>Available seats</p>
        <p class="seat" id="seatCount"></p>
        <button id="registerBtn">Register</button>
      </div>
    </section>
  </main>
</body>
</html>
