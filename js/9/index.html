<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 9 | Async</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:980px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:16px}.spinner{width:42px;height:42px;border:4px solid #154b25;border-top-color:#28ff75;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">Async JS, Promises, Async/Await</p>
    <h1>Mock API Events</h1>
    <div id="loading" class="spinner"></div>
    <section class="grid" id="eventList"></section>
  </main>
</body>
</html>
