<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13 | Debugging</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:900px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.panel{background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:18px;margin-top:16px}input{width:100%;background:#020502;color:#eaffea;border:1px solid #28ff75;border-radius:6px;padding:12px;margin:8px 0}button{background:#28ff75;color:#061006;border:0;border-radius:6px;padding:12px 16px;font-weight:800}.log{font-family:Consolas,monospace;color:#7cff9d}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">Debugging and Testing</p>
    <h1>Debug Registration Flow</h1>
    <form id="debugForm" class="panel">
      <input name="name" placeholder="Name">
      <input name="email" placeholder="Email">
      <button>Debug Submit</button>
    </form>
    <section class="panel">
      <h2>Debug Checklist</h2>
      <p class="log">Console logs form steps, payload, and fetch status. Add a breakpoint inside main.js submit handler.</p>
      <p id="result"></p>
    </section>
  </main>
</body>
</html>
