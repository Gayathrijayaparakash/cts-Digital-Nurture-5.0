<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 | Functions</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:980px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{background:#020502;color:#eaffea;border:1px solid #28ff75;border-radius:6px;padding:11px}button{background:#28ff75;color:#061006;border:0;border-radius:6px;padding:11px 14px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:16px}.log{color:#7cff9d}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">Functions, Scope, Closures, Higher-Order Functions</p>
    <h1>Reusable Event Operations</h1>
    <div class="tools">
      <input id="search" placeholder="Search by name">
      <select id="category"><option>All</option><option>Music</option><option>Workshop</option><option>Sports</option></select>
      <button id="addBtn">Add Demo Event</button>
    </div>
    <p class="log" id="log"></p>
    <section class="grid" id="eventList"></section>
  </main>
</body>
</html>
