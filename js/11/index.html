<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 11 | Forms</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:760px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}label{display:block;margin:14px 0 6px}input,select{width:100%;background:#020502;color:#eaffea;border:1px solid #28ff75;border-radius:6px;padding:12px}button{margin-top:18px;background:#28ff75;color:#061006;border:0;border-radius:6px;padding:12px 16px;font-weight:800}.error{color:#ff7777;min-height:20px}.success{color:#7cff9d}
  </style>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">Working with Forms</p>
    <h1>Event Sign-Up</h1>
    <form id="registerForm" novalidate>
      <label>Name</label>
      <input name="name">
      <p class="error" id="nameError"></p>
      <label>Email</label>
      <input name="email">
      <p class="error" id="emailError"></p>
      <label>Event</label>
      <select name="eventName">
        <option value="">Choose an event</option>
        <option>Neon Night Market</option>
        <option>Repair Cafe</option>
      </select>
      <p class="error" id="eventError"></p>
      <button>Submit Registration</button>
    </form>
    <p class="success" id="result"></p>
  </main>
</body>
</html>
