<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 14 | jQuery</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;padding:24px}.app{max-width:980px;margin:auto;border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7540;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}button{background:#28ff75;color:#061006;border:0;border-radius:6px;padding:12px 16px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.card{display:none;background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:16px}.note{color:#7cff9d}
  </style>
</head>
<body>
  <main class="app">
    <p class="tag">jQuery and JS Frameworks</p>
    <h1>jQuery Event Cards</h1>
    <button id="registerBtn">Toggle Events</button>
    <section class="grid">
      <article class="card"><h2>jQuery Jam</h2><p>Click the button to fade cards in and out.</p></article>
      <article class="card"><h2>Framework Future</h2><p class="note">React or Vue helps organize state, reusable components, and larger app workflows.</p></article>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
