<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1 | Community Portal</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#050805;color:#eaffea;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(920px,100%);border:1px solid #28ff75;background:#071107;border-radius:8px;box-shadow:0 0 34px #28ff7544;padding:28px}.tag{color:#28ff75;text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{margin:10px 0;font-size:clamp(2rem,5vw,4rem);line-height:1}.panel{margin-top:24px;background:#0d190d;border:1px solid #1d7d3e;border-radius:8px;padding:18px}.console{font-family:Consolas,monospace;color:#7cff9d;background:#020502;border-left:4px solid #28ff75;padding:14px}
  </style>
  <script src="main.js"></script>
</head>
<body>
  <main class="app">
    <p class="tag">JavaScript Basics & Setup</p>
    <h1>Local Community Event Portal</h1>
    <section class="panel">
      <h2>Script Connected</h2>
      <p>This page loads <strong>main.js</strong>, writes a welcome message to the console, and shows an alert after the page fully loads.</p>
      <p class="console">Open DevTools Console to see: Welcome to the Community Portal</p>
    </section>
  </main>
</body>
</html>
