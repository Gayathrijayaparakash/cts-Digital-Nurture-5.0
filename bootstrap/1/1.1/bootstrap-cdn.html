<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap 5 - CDN Demo</title>

  <!-- Bootstrap 5 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <header class="py-4 border-bottom border-secondary">
    <div class="container">
      <h1 class="h3 mb-1">Exercise 1.1 — Bootstrap 5 via CDN</h1>
      <p class="text-secondary mb-0">Buttons, grid, and components using Bootstrap styles.</p>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="card bg-secondary-subtle border-secondary">
          <div class="card-body">
            <h2 class="h5">Hello Bootstrap</h2>
            <p class="text-secondary mb-3">This page loads Bootstrap using a CDN link tag.</p>
            <div class="d-flex gap-2 flex-wrap">
              <button class="btn btn-success" type="button">Primary action</button>
              <button class="btn btn-outline-light" type="button" data-bs-toggle="modal" data-bs-target="#demoModal">Open modal</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="p-4 rounded-3 border border-secondary bg-dark">
          <h3 class="h5">Bootstrap Grid</h3>
          <p class="text-secondary mb-2">Resize the window to see responsive columns.</p>
          <div class="row g-2">
            <div class="col-6">
              <div class="p-3 rounded-2 bg-success bg-opacity-25 border border-success border-opacity-50 text-center">Col 1</div>
            </div>
            <div class="col-6">
              <div class="p-3 rounded-2 bg-success bg-opacity-25 border border-success border-opacity-50 text-center">Col 2</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal (to confirm Bootstrap JS bundle works) -->
  <div class="modal fade" id="demoModal" tabindex="-1" aria-labelledby="demoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="demoModalLabel">Bootstrap Modal</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Bootstrap JS is enabled via <code>bootstrap.bundle.min.js</code>.
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 (CDN) JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
