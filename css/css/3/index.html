<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Selectors Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="mainHeader">
    <span class="glow-label">Selector arena</span>
    <h1>Local Community Event Portal</h1>
    <p>Selector practice with real event content.</p>
  </header>

  <main>
    <h2>Upcoming Events</h2>
    <section class="eventCard">
      <span class="slot">Today</span>
      <h3>City Book Swap</h3>
      <p>Bring a book, take a book, and meet other readers from your neighborhood.</p>
    </section>
    <section class="eventCard">
      <span class="slot">Tomorrow</span>
      <h3>Open-Air Yoga</h3>
      <p>Start the morning with a guided yoga session at the riverfront lawn.</p>
    </section>
  </main>
</body>
</html>
