<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7 - Table Styling</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="table-kicker">Admin console</span>
    <h1>Events Admin Table</h1>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Event</th>
          <th>Date</th>
          <th>Location</th>
          <th>Status</th>
          <th>Capacity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Food Fair</td>
          <td>June 14</td>
          <td>Central Park</td>
          <td>Open</td>
          <td>180</td>
        </tr>
        <tr>
          <td>Yoga Morning</td>
          <td>June 18</td>
          <td>Riverfront Lawn</td>
          <td>Open</td>
          <td>60</td>
        </tr>
        <tr>
          <td>Book Swap</td>
          <td>June 22</td>
          <td>Library Hall</td>
          <td>Full</td>
          <td>40</td>
        </tr>
        <tr>
          <td>Clean-Up Drive</td>
          <td>June 29</td>
          <td>Market Street</td>
          <td>Open</td>
          <td>220</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
