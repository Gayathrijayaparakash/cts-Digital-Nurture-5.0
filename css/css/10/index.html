<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10 - Responsive Design</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="responsive-kicker">Mobile ready</span>
    <h1>Responsive Community Portal</h1>
    <nav>
      <a href="#events">Events</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="event-grid" id="events">
      <article class="eventCard">
        <img src="https://images.unsplash.com/photo-1528605105345-5344ea20e269?auto=format&fit=crop&w=800&q=80" alt="People at a community event">
        <span class="card-chip">Friday</span>
        <h2>Music in the Plaza</h2>
        <p>Live performances every Friday evening.</p>
      </article>
      <article class="eventCard">
        <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=800&q=80" alt="Community meeting">
        <span class="card-chip">Workshop</span>
        <h2>Civic Ideas Forum</h2>
        <p>Share ideas for improving local spaces.</p>
      </article>
    </section>
  </main>
</body>
</html>
