<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6 - Links and Lists</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="nav-kicker">Link states</span>
    <h1>Community Event Portal</h1>
    <nav>
      <ul class="nav-menu">
        <li><a href="#events">Events</a></li>
        <li><a href="#clubs">Clubs</a></li>
        <li><a href="#volunteer">Volunteer</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="events">
      <h2>Popular Programs</h2>
      <ul class="program-list">
        <li>Art workshops every Saturday</li>
        <li>Gardening club meetups in the civic garden</li>
        <li>Free technology help desk for seniors</li>
      </ul>
      <div class="link-card">
        <a href="#volunteer">Become a portal volunteer</a>
      </div>
      <p><a href="https://example.com">Visit partner resources</a></p>
    </section>
  </main>
</body>
</html>
